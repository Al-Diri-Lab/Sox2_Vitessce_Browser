<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Sox2 Multiome</title>
  <script type="importmap">
  {
    "imports": {
          "react": "https://esm.sh/react@18.2.0?dev",
          "react-dom": "https://esm.sh/react-dom@18.2.0?dev",
          "react-dom/client": "https://esm.sh/react-dom@18.2.0/client?dev",
          "vitessce": "https://unpkg.com/vitessce@latest"
    }
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body  { margin: 0; background: #111; overflow: hidden; }
    #root { width: 100vw; height: 100vh; }
    #error { color: #ff6b6b; padding: 20px; font-family: monospace; white-space: pre; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import React             from 'react';
    import { createRoot }    from 'react-dom/client';
    import { Vitessce }      from 'vitessce';

    fetch('config.json')
      .then(res => {
        if (!res.ok) throw new Error(`Failed to load config.json: ${res.status} ${res.statusText}`);
        return res.json();
      })
      .then(config => {
        function App() {
          return React.createElement(Vitessce, {
            config,
            theme:  'dark',
            height: window.innerHeight,
          });
        }
        createRoot(document.getElementById('root')).render(React.createElement(App));
      })
      .catch(err => {
        console.error(err);
        document.getElementById('root').innerHTML =
          `<div id="error">Error loading visualization:\n\n${err}</div>`;
      });
  </script>
</body>
</html>
